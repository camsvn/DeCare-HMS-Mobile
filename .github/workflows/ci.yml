name: CI
on:
  push:
    branches: ['**']
  pull_request:
# One run per ref: a new push supersedes the run still going for the old tip.
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.19.0', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: build/app/outputs/flutter-apk/app-debug.apk, retention-days: 7 }
