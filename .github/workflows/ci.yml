name: CI

# Runs once per change: on pushes to main and on pull requests into it.
# Feature branches are checked through their PR, not on every push; run it by
# hand on any branch from the Actions tab if needed. Documentation-only commits
# skip it. Release builds live in release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# One run per ref: a new push supersedes the run still going for the old tip.
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.19.0', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      # The tests cannot catch Gradle or manifest breakage (plugin bumps, the
      # splash generator, an application-id change); only a real build does.
      - run: flutter build apk --debug
