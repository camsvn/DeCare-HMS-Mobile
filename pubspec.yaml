name: hms_uploader
description: DeCare HMS tomogram uploader.
publish_to: 'none'
version: 2026.9.3+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  # v11 dropped the EncryptedSharedPreferences backend v9 used; existing
  # installs lose the saved session and log in once more. Decided 2026-09-11.
  flutter_secure_storage: ^11.1.0
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.8
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  camera: ^0.12.1
  # CameraX writes sensor-oriented JPEGs with an EXIF orientation tag. The
  # clinic's viewers are unknown and may ignore EXIF, and the picker path this
  # replaces uploaded upright pixels, so the rotation is baked in before upload.
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  vector_graphics_compiler: ^1.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  # Assets are generated from the sources in tools/branding/ — see docs/branding.md
  # for the exact commands and the portrait-lock gotcha after `create`.
  color: "#151D28"
  color_dark: "#0B1017"
  image: assets/images/splash_logo.png
  branding: assets/images/splash_branding.png
  branding_mode: bottom
  android_12:
    color: "#151D28"
    color_dark: "#0B1017"
    image: assets/images/splash_icon_a12.png
    branding: assets/images/splash_branding.png
  android: true
  ios: true
  web: false
