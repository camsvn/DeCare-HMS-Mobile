name: hms_uploader
description: DeCare HMS tomogram uploader.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.11.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.0.0
  permission_handler: ^11.3.1
  uuid: ^4.6.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10
  flutter_native_splash: ^2.4.0
  package_info_plus: ^8.0.2
  # 7.x reads `flutter.compileSdkVersion` from the Flutter Gradle plugin,
  # which Flutter 3.19 does not provide; 6.x exposes the same Dart API.
  connectivity_plus: ^6.1.5
  path_provider: ^2.1.0
  # 0.12+ needs a newer Flutter than 3.19; 0.11.0+2 pulls
  # camera_android_camerax 0.6.5+2, which builds on this SDK.
  camera: ^0.11.0+2
  # CameraX writes sensor-oriented JPEGs with an EXIF orientation tag. The
  # clinic's viewers are unknown and may ignore EXIF, and the picker path this
  # replaces uploaded upright pixels, so the rotation is baked in before upload.
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5
  vector_graphics_compiler: ^1.1.11+1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  # Rendered from assets/images/hms_circle.svg with ImageMagick:
  #   magick -background none -density 600 hms_circle.svg -resize 768x768 splash_logo.png
  #   magick -size 1152x1152 xc:none splash_logo.png -gravity center -composite splash_icon_a12.png
  # Android 12 masks the splash icon to the inner two thirds of a 240 dp square,
  # so the logo sits in the centre 768 px of a 1152 px canvas.
  color: "#151D28"
  image: assets/images/splash_logo.png
  android_12:
    color: "#151D28"
    image: assets/images/splash_icon_a12.png
  android: true
  ios: true
  web: false
